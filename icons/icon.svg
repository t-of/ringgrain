<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <radialGradient id="bg" cx="0.5" cy="0.42" r="0.75">
    <stop offset="0" stop-color="#241a13"/>
    <stop offset="1" stop-color="#0c0805"/>
  </radialGradient>
  <clipPath id="c"><rect width="512" height="512" rx="112"/></clipPath>
</defs>
<g clip-path="url(#c)">
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- 切り株の年輪。外側ほど新しい 1 年ぶんの帯（明るい 5 色）、内側は木の地 -->
  <circle cx="256" cy="256" r="205" fill="#1d130c"/>
  <circle cx="256" cy="256" r="194" fill="#f4d77a"/>
  <circle cx="256" cy="256" r="172" fill="#b08e63"/>
  <circle cx="256" cy="256" r="158" fill="#a8cf8e"/>
  <circle cx="256" cy="256" r="135" fill="#cfae86"/>
  <circle cx="256" cy="256" r="118" fill="#7d8db3"/>
  <circle cx="256" cy="256" r="95" fill="#b08e63"/>
  <circle cx="256" cy="256" r="75" fill="#4b3c63"/>
  <circle cx="256" cy="256" r="55" fill="#cfae86"/>
  <circle cx="256" cy="256" r="22" fill="#2b1b12"/>
  <circle cx="256" cy="256" r="7" fill="#6b4a34"/>

  <!-- 木目のうすい筋 -->
  <g stroke="#000" stroke-opacity="0.12" fill="none" stroke-width="2">
    <circle cx="256" cy="256" r="126"/>
    <circle cx="256" cy="256" r="105"/>
    <circle cx="256" cy="256" r="65"/>
  </g>

  <!-- 今日の帯（いちばん外、明滅するふちどりのイメージ） -->
  <path d="M 220 63 A 194 194 0 0 1 292 63" fill="none" stroke="#fff3c9" stroke-width="15" stroke-linecap="round"/>
</g>
</svg>
